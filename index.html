<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cerebro — Hermes Ecosystem Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f15;
      --surface: #111720;
      --surface-2: #172032;
      --border: #212d44;
      --text: #e6eaf2;
      --text-muted: #7a8599;
      --accent: #4f8cff;
      --accent-dim: rgba(79,140,255,0.18);
      --green: #2dd4a8;
      --green-dim: rgba(45,212,168,0.14);
      --orange: #f5b045;
      --orange-dim: rgba(245,176,69,0.14);
      --red: #f87171;
      --red-dim: rgba(248,113,113,0.14);
      --purple: #a78bfa;
      --purple-dim: rgba(167,139,250,0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 12px;
    }

    /* Header */
    header {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 10px;
      flex-shrink: 0;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      position: relative;
      overflow: hidden;
    }
    .panel::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(79,140,255,0.35), transparent);
    }
    .panel-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .metric {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
    }
    .metric-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Main layout */
    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 220px 1fr 320px;
      gap: 12px;
      min-height: 0;
    }
    .panel-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .panel-block::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(79,140,255,0.25), transparent);
    }
    .panel-block-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    /* Sidebar nav */
    .nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }
    .nav button {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 12px;
      font-weight: 500;
      text-align: left;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav button:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(79,140,255,0.08);
    }
    .nav button.active {
      background: var(--accent-dim);
      border-color: rgba(79,140,255,0.45);
      color: var(--accent);
    }
    .nav-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
    }
    .nav button.active .nav-dot {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent-dim);
    }

    /* Center viewport */
    .viewport {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
      overflow: hidden;
    }
    .view-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .view-title::before {
      content: "";
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent-dim);
    }

    /* Right detail panel */
    .detail-empty {
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;
      padding: 24px 8px;
    }

    /* Cards / rows */
    .item {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
      margin-bottom: 8px;
    }
    .item:hover {
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(79,140,255,0.12);
    }
    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .item-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
    }
    .item-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-muted);
    }
    .item-expand {
      color: var(--accent);
      font-size: 12px;
      transition: transform 0.2s ease;
    }
    .item.expanded .item-expand {
      transform: rotate(45deg);
    }
    .item-body {
      display: none;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
    }
    .item.expanded .item-body { display: block; }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }
    .chip {
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      border: 1px solid var(--border);
      background: rgba(79,140,255,0.08);
      color: var(--text);
    }
    .chip.ok { background: var(--green-dim); color: var(--green); border-color: rgba(45,212,168,0.3); }
    .chip.warn { background: var(--orange-dim); color: var(--orange); border-color: rgba(245,176,69,0.3); }
    .chip.plan { background: var(--purple-dim); color: var(--purple); border-color: rgba(167,139,250,0.3); }

    /* Status rows */
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .status-row:hover { border-color: var(--accent); }
    .status-domain {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
    }
    .status-bar {
      width: 100px;
      height: 5px;
      border-radius: 3px;
      background: var(--surface);
      overflow: hidden;
    }
    .status-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--accent), var(--green));
    }

    /* Detail panel helpers */
    .detail-section {
      margin-bottom: 12px;
    }
    .detail-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .detail-text {
      font-size: 12px;
      color: var(--text);
      line-height: 1.5;
    }

    footer {
      flex-shrink: 0;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-muted);
    }

    @media (max-width: 980px) {
      .main { grid-template-columns: 1fr; }
      header { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 640px) {
      header { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="panel">
        <div class="panel-title">Ecossistema</div>
        <div class="metric" id="metric-ecosystem">--</div>
        <div class="metric-sub">Módulos mapeados</div>
      </div>
      <div class="panel">
        <div class="panel-title">Skills</div>
        <div class="metric" id="metric-skills">--</div>
        <div class="metric-sub">Competências ativas</div>
      </div>
      <div class="panel">
        <div class="panel-title">Frameworks</div>
        <div class="metric" id="metric-frameworks">--</div>
        <div class="metric-sub">Implementados</div>
      </div>
      <div class="panel">
        <div class="panel-title">Maturidade</div>
        <div class="metric" id="metric-maturity">--</div>
        <div class="metric-sub">Nível geral</div>
      </div>
    </header>

    <div class="main">
      <div class="panel-block">
        <div class="panel-block-title">Navegação</div>
        <div class="nav">
          <button class="active" data-view="overview">
            <span class="nav-dot"></span>Visão geral
          </button>
          <button data-view="skills">
            <span class="nav-dot"></span>Skills
          </button>
          <button data-view="frameworks">
            <span class="nav-dot"></span>Frameworks
          </button>
          <button data-view="maturity">
            <span class="nav-dot"></span>Maturidade
          </button>
          <button data-view="competencies">
            <span class="nav-dot"></span>Competências
          </button>
          <button data-view="projects">
            <span class="nav-dot"></span>Projetos
          </button>
        </div>
      </div>

      <div class="panel-block">
        <div class="view-title" id="view-title">Visão geral</div>
        <div class="viewport" id="viewport"></div>
      </div>

      <div class="panel-block">
        <div class="panel-block-title">Detalhes</div>
        <div id="detail">
          <div class="detail-empty">Selecione um item para ver detalhes.</div>
        </div>
      </div>
    </div>

    <footer>
      <span>HERMES ECOSYSTEM MAP v1.0.0</span>
      <a href="https://github.com/flavio-guedes/Cerebro" target="_blank" style="color:var(--accent);text-decoration:none;">flavio-guedes/Cerebro</a>
    </footer>
  </div>

  <script>
    const ecosystem = {
      projects: [
        { name: "epq", status: "ACTIVE", stack: ["Next.js", "Tailwind", "FastAPI"], notes: "Produto principal de conteúdo e IA." },
        { name: "sistema-prospeccao", status: "ACTIVE", stack: ["FastAPI", "HTML", "Proxy APIs"], notes: "Automação de prospecção e WhatsApp." },
        { name: "ai-hub", status: "ACTIVE", stack: ["HTML", "JSON", "JS"], notes: "Hub de interfaces standalone." },
        { name: "Cerebro", status: "ACTIVE", stack: ["HTML", "JS", "JSON"], notes: "Mapa vivo do ecossistema Hermes." },
        { name: "prospects", status: "PLANNED", stack: ["Next.js", "Recharts"], notes: "Pipeline de prospects." },
        { name: "pessoas", status: "PLANNED", stack: ["FastAPI", "React"], notes: "Gestão de pessoas e perfis." },
        { name: "agentes", status: "PLANNED", stack: ["Python", "LLMs"], notes: "Agentes autônomos." },
        { name: "b2b-opportunity-finder", status: "PLANNED", stack: ["Python", "APIs"], notes: "Oportunidades B2B." }
      ],
      skills: [
        { name: "Frontend (HTML/CSS/JS)", maturity: "high", tools: ["Vite", "Webpack", "Storybook", "Chromatic"] },
        { name: "React / Next.js", maturity: "high", tools: ["Next.js", "React", "TypeScript", "Vite"] },
        { name: "Tailwind CSS", maturity: "high", tools: ["Tailwind", "PostCSS", "Autoprefixer"] },
        { name: "Python / FastAPI", maturity: "high", tools: ["FastAPI", "Uvicorn", "Pydantic", "Alembic"] },
        { name: "IA / LLMs / Embeddings", maturity: "mid", tools: ["OpenAI", "Anthropic", "HuggingFace", "LangChain"] },
        { name: "Automação / Agents", maturity: "mid", tools: ["n8n", "Make", "Zapier", "CrewAI"] },
        { name: "GitHub Actions / CI", maturity: "mid", tools: ["GitHub Actions", "Workflows", "Environments"] },
        { name: "APIs / Integrações", maturity: "high", tools: ["REST", "GraphQL", "Webhooks", "OAuth2"] },
        { name: "Dashboards / Visualização", maturity: "high", tools: ["D3.js", "Recharts", "ECharts", "Grafana"] },
        { name: "Design Systems", maturity: "mid", tools: ["shadcn/ui", "Radix UI", "Storybook", "Tokens"] },
        { name: "Scraping / Browser", maturity: "mid", tools: ["Playwright", "Puppeteer", "Cheerio", "Browser Use"] },
        { name: "Deploy / GitHub Pages", maturity: "high", tools: ["GitHub Pages", "Vercel", "Netlify", "Docker"] }
      ],
      frameworks: [
        { name: "Next.js", status: "ACTIVE", details: "App Router, SSR/SSG, Edge Functions, API Routes" },
        { name: "FastAPI", status: "ACTIVE", details: "Async Python, OpenAPI, Dependency Injection, Middleware" },
        { name: "Tailwind", status: "ACTIVE", details: "Utility-first, JIT, Custom themes, Plugins" },
        { name: "GSAP", status: "ACTIVE", details: "ScrollTrigger, timelines, motion design, performance" },
        { name: "Framer Motion", status: "ACTIVE", details: "React animations, gestures, layout animations" },
        { name: "Three.js", status: "EXPERIMENTAL", details: "WebGL, 3D scenes, shaders, spatial interfaces" },
        { name: "Playwright", status: "PLANNED", details: "E2E testing, cross-browser, visual regression" },
        { name: "PostgreSQL", status: "ACTIVE", details: "Relational data, JSONB, migrations, pooling" },
        { name: "Redis", status: "ACTIVE", details: "Cache, sessions, queues, pub/sub" }
      ],
      maturity: [
        { domain: "Frontend", count: 4, maturity: "92%" },
        { domain: "IA / ML", count: 3, maturity: "85%" },
        { domain: "Automação", count: 4, maturity: "78%" },
        { domain: "Integrações", count: 5, maturity: "88%" },
        { domain: "DevOps", count: 3, maturity: "80%" },
        { domain: "Dados", count: 3, maturity: "90%" }
      ],
      competencies: [
        { name: "Arquitetura de interfaces de alto impacto", detail: "Dashboards, SaaS, CRMs, command centers, landing pages." },
        { name: "Sistemas de IA e automação", detail: "LLMs, agentes, pipelines de dados, automação de processos." },
        { name: "Dashboards e visualização de dados", detail: "KPIs, relatórios, data storytelling, real-time." },
        { name: "Integrações e APIs", detail: "APIs REST/GraphQL, webhooks, OAuth2, conectores externos." },
        { name: "Design Systems e componentização", detail: "Bibliotecas reutilizáveis, tokens, documentação viva." },
        { name: "Deploy e infraestrutura web", detail: "CI/CD, GitHub Pages, Vercel, Docker, monitoramento." }
      ]
    };

    let selected = null;

    function setDetail(content) {
      document.getElementById('detail').innerHTML = content;
    }

    function renderOverview() {
      document.getElementById('view-title').textContent = 'Visão geral';
      const html = `
        <div class="detail-section">
          <div class="detail-label">Status do ecossistema</div>
          <div class="detail-text">Ecossistema ativo com ${ecosystem.projects.filter(p => p.status === 'ACTIVE').length} projetos em produção e ${ecosystem.projects.filter(p => p.status === 'PLANNED').length} planejados.</div>
        </div>
        <div class="detail-section">
          <div class="detail-label">Distribuição</div>
          <div class="chips">
            <span class="chip ok">${ecosystem.projects.filter(p => p.status === 'ACTIVE').length} ativos</span>
            <span class="chip plan">${ecosystem.projects.filter(p => p.status === 'PLANNED').length} planejados</span>
            <span class="chip warn">${ecosystem.frameworks.filter(f => f.status === 'EXPERIMENTAL').length} experimentais</span>
          </div>
        </div>
      `;
      setDetail(html);
    }

    function renderSkills() {
      document.getElementById('view-title').textContent = 'Skills & Competências';
      const container = document.getElementById('viewport');
      container.innerHTML = '';
      ecosystem.skills.forEach(skill => {
        const item = document.createElement('div');
        item.className = 'item';
        const maturityLabel = skill.maturity === 'high' ? 'ALTA' : skill.maturity === 'mid' ? 'MÉDIA' : 'BAIXA';
        const maturityClass = skill.maturity === 'high' ? 'chip ok' : skill.maturity === 'mid' ? 'chip warn' : 'chip plan';
        item.innerHTML = `
          <div class="item-header">
            <span class="item-name">${skill.name}</span>
            <span class="chip ${maturityClass}">${maturityLabel}</span>
            <span class="item-expand">+</span>
          </div>
          <div class="item-body">
            <div class="detail-label">Ferramentas</div>
            <div class="chips">
              ${(skill.tools || []).map(t => `<span class="chip">${t}</span>`).join('')}
            </div>
          </div>
        `;
        item.addEventListener('click', () => {
          item.classList.toggle('expanded');
          if (item.classList.contains('expanded')) {
            setDetail(`
              <div class="detail-section">
                <div class="detail-label">Skill</div>
                <div class="detail-text">${skill.name}</div>
              </div>
              <div class="detail-section">
                <div class="detail-label">Maturidade</div>
                <div class="detail-text">${maturityLabel}</div>
              </div>
              <div class="detail-section">
                <div class="detail-label">Ferramentas</div>
                <div class="chips">${(skill.tools || []).map(t => `<span class="chip">${t}</span>`).join('')}</div>
              </div>
            `);
          }
        });
        container.appendChild(item);
      });
    }

    function renderFrameworks() {
      document.getElementById('view-title').textContent = 'Frameworks Implementados';
      const container = document.getElementById('viewport');
      container.innerHTML = '';
      ecosystem.frameworks.forEach(fw => {
        const item = document.createElement('div');
        item.className = 'item';
        const statusClass = fw.status === 'ACTIVE' ? 'chip ok' : fw.status === 'EXPERIMENTAL' ? 'chip warn' : 'chip plan';
        item.innerHTML = `
          <div class="item-header">
            <span class="item-name">${fw.name}</span>
            <span class="${statusClass}">${fw.status}</span>
            <span class="item-expand">+</span>
          </div>
          <div class="item-body">
            <div class="detail-label">Implementação</div>
            <div class="detail-text">${fw.details}</div>
          </div>
        `;
        item.addEventListener('click', () => {
          item.classList.toggle('expanded');
          if (item.classList.contains('expanded')) {
            setDetail(`
              <div class="detail-section">
                <div class="detail-label">Framework</div>
                <div class="detail-text">${fw.name}</div>
              </div>
              <div class="detail-section">
                <div class="detail-label">Status</div>
                <div class="detail-text">${fw.status}</div>
              </div>
              <div class="detail-section">
                <div class="detail-label">Implementação</div>
                <div class="detail-text">${fw.details}</div>
              </div>
            `);
          }
        });
        container.appendChild(item);
      });
    }

    function renderMaturity() {
      document.getElementById('view-title').textContent = 'Maturidade por Domínio';
      const container = document.getElementById('viewport');
      container.innerHTML = '';
      ecosystem.maturity.forEach(m => {
        const row = document.createElement('div');
        row.className = 'status-row';
        row.innerHTML = `
          <span class="status-domain">${m.domain}</span>
          <div class="status-bar"><div class="status-fill" style="width:${m.maturity}"></div></div>
          <span class="chip ok">${m.maturity}</span>
        `;
        row.addEventListener('click', () => {
          setDetail(`
            <div class="detail-section">
              <div class="detail-label">Domínio</div>
              <div class="detail-text">${m.domain}</div>
            </div>
            <div class="detail-section">
              <div class="detail-label">Habilidades</div>
              <div class="detail-text">${m.count}</div>
            </div>
            <div class="detail-section">
              <div class="detail-label">Maturidade</div>
              <div class="detail-text">${m.maturity}</div>
            </div>
          `);
        });
        container.appendChild(row);
      });
    }

    function renderCompetencies() {
      document.getElementById('view-title').textContent = 'Competências Principais';
      const container = document.getElementById('viewport');
      container.innerHTML = '';
      ecosystem.competencies.forEach(c => {
        const item = document.createElement('div');
        item.className = 'item';
        item.innerHTML = `
          <div class="item-header">
            <span class="item-name">${c.name}</span>
            <span class="item-expand">+</span>
          </div>
          <div class="item-body">
            <div class="detail-label">Aplicação</div>
            <div class="detail-text">${c.detail}</div>
          </div>
        `;
        item.addEventListener('click', () => {
          item.classList.toggle('expanded');
          if (item.classList.contains('expanded')) {
            setDetail(`
              <div class="detail-section">
                <div class="detail-label">Competência</div>
                <div class="detail-text">${c.name}</div>
              </div>
              <div class="detail-section">
                <div class="detail-label">Aplicação</div>
                <div class="detail-text">${c.detail}</div>
              </div>
            `);
          }
        });
        container.appendChild(item);
      });
    }

    function renderProjects() {
      document.getElementById('view-title').textContent = 'Projetos';
      const container = document.getElementById('viewport');
      container.innerHTML = '';
      ecosystem.projects.forEach(p => {
        const item = document.createElement('div');
        item.className = 'item';
        const statusClass = p.status === 'ACTIVE' ? 'chip ok' : 'chip plan';
        item.innerHTML = `
          <div class="item-header">
            <span class="item-name">${p.name}</span>
            <span class="${statusClass}">${p.status}</span>
            <span class="item-expand">+</span>
          </div>
          <div class="item-body">
            <div class="detail-label">Stack</div>
            <div class="chips">${(p.stack || []).map(s => `<span class="chip">${s}</span>`).join('')}</div>
            <div class="detail-label" style="margin-top:8px;">Notas</div>
            <div class="detail-text">${p.notes}</div>
          </div>
        `;
        item.addEventListener('click', () => {
          item.classList.toggle('expanded');
          if (item.classList.contains('expanded')) {
            setDetail(`
              <div class="detail-section">
                <div class="detail-label">Projeto</div>
                <div class="detail-text">${p.name}</div>
              </div>
              <div class="detail-section">
                <div class="detail-label">Status</div>
                <div class="detail-text">${p.status}</div>
              </div>
              <div class="detail-section">
                <div class="detail-label">Stack</div>
                <div class="chips">${(p.stack || []).map(s => `<span class="chip">${s}</span>`).join('')}</div>
              </div>
              <div class="detail-section">
                <div class="detail-label">Notas</div>
                <div class="detail-text">${p.notes}</div>
              </div>
            `);
          }
        });
        container.appendChild(item);
      });
    }

    function init() {
      document.getElementById('metric-ecosystem').textContent = String(ecosystem.projects.length);
      document.getElementById('metric-skills').textContent = String(ecosystem.skills.length);
      document.getElementById('metric-frameworks').textContent = String(ecosystem.frameworks.filter(f => f.status === 'ACTIVE').length);
      document.getElementById('metric-maturity').textContent = '87%';

      document.querySelectorAll('.nav button').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const view = btn.dataset.view;
          document.getElementById('viewport').innerHTML = '';
          if (view === 'overview') renderOverview();
          if (view === 'skills') renderSkills();
          if (view === 'frameworks') renderFrameworks();
          if (view === 'maturity') renderMaturity();
          if (view === 'competencies') renderCompetencies();
          if (view === 'projects') renderProjects();
        });
      });

      renderOverview();
    }

    init();
  </script>
</body>
</html>
