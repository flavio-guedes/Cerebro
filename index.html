<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cerebro — Hermes Ecosystem Radar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #020b16;
      --surface: #0a1628;
      --surface-2: #0f2140;
      --border: #1a3a5c;
      --text: #e6f3ff;
      --text-muted: #5a7a9a;
      --cyan: #22d3ee;
      --cyan-dim: rgba(34,211,238,0.25);
      --green: #34d399;
      --green-dim: rgba(52,211,153,0.15);
      --orange: #fbbf24;
      --orange-dim: rgba(251,191,36,0.15);
      --red: #f87171;
      --red-dim: rgba(248,113,113,0.18);
      --purple: #a78bfa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
    }

    /* Scanlines */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.12) 3px);
      z-index: 50;
    }

    /* Grid background */
    .grid-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(34,211,238,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34,211,238,0.06) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
    }

    /* Header compact */
    header {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      flex-shrink: 0;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      position: relative;
      overflow: hidden;
    }
    .panel::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      opacity: 0.4;
    }
    .panel-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 9px;
      letter-spacing: 0.25em;
      color: var(--cyan);
      text-transform: uppercase;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .panel-title::before {
      content: "";
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 6px var(--cyan);
    }

    /* Navigation */
    .nav {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .nav button {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      transition: all 0.2s;
      text-transform: uppercase;
      flex: 1;
    }
    .nav button:hover {
      border-color: var(--cyan);
      color: var(--cyan);
      box-shadow: 0 0 10px var(--cyan-dim);
    }
    .nav button.active {
      background: var(--cyan-dim);
      border-color: var(--cyan);
      color: var(--cyan);
    }

    /* Main area */
    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      min-height: 0;
    }
    .main-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .main-panel::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      opacity: 0.4;
    }

    /* Brain */
    .brain-container {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-height: 0;
    }
    .brain-svg {
      width: 100%;
      max-width: 380px;
      height: auto;
      filter: drop-shadow(0 0 12px var(--cyan-dim));
      transition: all 0.3s ease;
    }
    .brain-svg:hover {
      filter: drop-shadow(0 0 25px var(--cyan-dim));
    }

    /* Skills list */
    .skill-list {
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }
    .skill-item {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 6px;
    }
    .skill-item:hover {
      border-color: var(--cyan);
      box-shadow: 0 0 8px var(--cyan-dim);
    }
    .skill-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .skill-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .skill-name::before {
      content: "";
      width: 3px; height: 3px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 4px var(--cyan);
    }
    .skill-expand {
      color: var(--cyan);
      font-size: 11px;
      transition: transform 0.2s;
    }
    .skill-body {
      display: none;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
    }
    .skill-item.expanded .skill-body { display: block; }
    .skill-item.expanded .skill-expand { transform: rotate(45deg); }
    .tool-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 4px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 9px;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .tag-success { background: var(--green-dim); color: var(--green); border: 1px solid rgba(52,211,153,0.3); }
    .tag-warning { background: var(--orange-dim); color: var(--orange); border: 1px solid rgba(251,191,36,0.3); }
    .tag-danger { background: var(--red-dim); color: var(--red); border: 1px solid rgba(248,113,113,0.3); }
    .tag-info { background: var(--cyan-dim); color: var(--cyan); border: 1px solid rgba(34,211,238,0.3); }

    /* Frameworks */
    .framework-list {
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }
    .framework-item {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 6px;
    }
    .framework-item:hover {
      border-color: var(--cyan);
      box-shadow: 0 0 8px var(--cyan-dim);
    }
    .framework-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .framework-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      color: var(--cyan);
    }
    .framework-expand {
      color: var(--cyan);
      font-size: 11px;
      transition: transform 0.2s;
    }
    .framework-body {
      display: none;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-muted);
    }
    .framework-item.expanded .framework-body { display: block; }
    .framework-item.expanded .framework-expand { transform: rotate(45deg); }

    /* Maturity */
    .maturity-list {
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }
    .maturity-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .maturity-row:hover { border-color: var(--cyan); }
    .maturity-domain {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--cyan);
    }
    .maturity-bar {
      width: 100px;
      height: 5px;
      border-radius: 2px;
      background: var(--surface);
      overflow: hidden;
    }
    .maturity-fill {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--cyan), var(--green));
    }

    /* Competencies */
    .comp-list {
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }
    .comp-item {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .comp-item:hover { border-color: var(--cyan); }
    .comp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text);
    }
    .comp-body {
      display: none;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
      font-size: 10px;
      color: var(--text-muted);
    }
    .comp-item.expanded .comp-body { display: block; }

    /* Radar */
    .radar-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
    }
    .radar-svg {
      width: 100%;
      max-width: 280px;
      height: auto;
      filter: drop-shadow(0 0 12px var(--cyan-dim));
    }

    /* Metrics */
    .metric-number {
      font-family: 'Orbitron', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--cyan);
      text-shadow: 0 0 20px var(--cyan-dim);
      line-height: 1;
    }

    footer {
      flex-shrink: 0;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--text-muted);
    }

    @media (max-width: 980px) {
      header { grid-template-columns: 1fr; }
      .main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="container">
    <header>
      <div class="panel">
        <div class="panel-title">Hermes Ecosystem</div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);line-height:1.5;">
          Skills ativas: <span style="color:var(--cyan)" id="active-skills">--</span><br>
          Competências: <span style="color:var(--cyan)" id="main-skills">--</span><br>
          Maturidade: <span style="color:var(--green)" id="maturity-level">--</span>
        </div>
      </div>
      <div class="panel" style="text-align:center">
        <div class="metric-number" id="metric-frameworks">--</div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);margin-top:2px;">FRAMEWORKS ATIVOS</div>
      </div>
      <div class="panel">
        <div class="panel-title">System Status</div>
        <div style="display:grid; gap:6px; margin-top:4px;">
          <div>
            <div style="display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:9px;margin-bottom:3px;">
              <span style="color:var(--text-muted)">FRONTEND</span>
              <span class="tag tag-success">STABLE</span>
            </div>
            <div class="maturity-bar"><div class="maturity-fill" style="width:92%"></div></div>
          </div>
          <div>
            <div style="display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:9px;margin-bottom:3px;">
              <span style="color:var(--text-muted)">AUTOMAÇÃO</span>
              <span class="tag tag-warning">EXPANDING</span>
            </div>
            <div class="maturity-bar"><div class="maturity-fill" style="width:78%"></div></div>
          </div>
          <div>
            <div style="display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:9px;margin-bottom:3px;">
              <span style="color:var(--text-muted)">INTEGRAÇÕES</span>
              <span class="tag tag-success">CONNECTED</span>
            </div>
            <div class="maturity-bar"><div class="maturity-fill" style="width:85%"></div></div>
          </div>
        </div>
      </div>
    </header>

    <nav class="nav">
      <button class="active" data-tab="radar">Raio-X</button>
      <button data-tab="skills">Skills</button>
      <button data-tab="frameworks">Frameworks</button>
      <button data-tab="maturity">Maturidade</button>
      <button data-tab="competencies">Competências</button>
    </nav>

    <div class="main">
      <div class="main-panel" id="main-left">
        <div class="panel-title">Painel Principal</div>
        <div class="brain-container">
          <svg class="brain-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" id="brain-svg">
            <!-- Brain outline -->
            <path d="M100,30 C70,30 50,50 50,80 C50,110 65,125 80,130 L80,150 C80,155 85,160 100,160 C115,160 120,155 120,150 L120,130 C135,125 150,110 150,80 C150,50 130,30 100,30 Z"
                  fill="none" stroke="var(--cyan)" stroke-width="2"/>
            <!-- Brain hemispheres -->
            <path d="M100,40 C85,40 75,55 75,80 C75,105 85,120 100,125 C115,120 125,105 125,80 C125,55 115,40 100,40 Z"
                  fill="rgba(34,211,238,0.08)" stroke="var(--cyan)" stroke-width="1.5"/>
            <line x1="100" y1="40" x2="100" y2="160" stroke="var(--cyan)" stroke-width="1.5"/>
            <!-- Neural connections -->
            <path d="M80,60 L120,60 M80,80 L120,80 M80,100 L120,100 M80,120 L120,120" stroke="var(--cyan)" stroke-width="0.5" opacity="0.5"/>
            <circle cx="80" cy="60" r="2" fill="var(--cyan)"/>
            <circle cx="120" cy="60" r="2" fill="var(--cyan)"/>
            <circle cx="80" cy="80" r="2" fill="var(--cyan)"/>
            <circle cx="120" cy="80" r="2" fill="var(--cyan)"/>
            <circle cx="80" cy="100" r="2" fill="var(--cyan)"/>
            <circle cx="120" cy="100" r="2" fill="var(--cyan)"/>
            <circle cx="80" cy="120" r="2" fill="var(--cyan)"/>
            <circle cx="120" cy="120" r="2" fill="var(--cyan)"/>
            <!-- Center core -->
            <circle cx="100" cy="100" r="8" fill="var(--cyan)" opacity="0.8">
              <animate attributeName="r" values="8;10;8" dur="2s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
            </circle>
            <circle cx="100" cy="100" r="4" fill="var(--bg)"/>
            <!-- Pulse rings -->
            <circle cx="100" cy="100" r="20" fill="none" stroke="var(--cyan)" stroke-width="0.5" opacity="0.5">
              <animate attributeName="r" values="20;35;20" dur="3s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values="0.5;0;0.5" dur="3s" repeatCount="indefinite"/>
            </circle>
            <circle cx="100" cy="100" r="20" fill="none" stroke="var(--cyan)" stroke-width="0.5" opacity="0.5">
              <animate attributeName="r" values="20;35;20" dur="3s" repeatCount="indefinite" begin="1.5s"/>
              <animate attributeName="opacity" values="0.5;0;0.5" dur="3s" repeatCount="indefinite" begin="1.5s"/>
            </circle>
            <!-- Interactive hotspots -->
            <circle cx="80" cy="60" r="6" fill="transparent" class="brain-hotspot" data-area="frontend"/>
            <circle cx="120" cy="80" r="6" fill="transparent" class="brain-hotspot" data-area="ia"/>
            <circle cx="80" cy="100" r="6" fill="transparent" class="brain-hotspot" data-area="automacao"/>
            <circle cx="120" cy="120" r="6" fill="transparent" class="brain-hotspot" data-area="integracoes"/>
          </svg>
        </div>
      </div>

      <div class="main-panel" id="main-right">
        <div class="panel-title" id="panel-title">Raio-X</div>
        <div id="main-content" class="skill-list"></div>
      </div>
    </div>

    <footer>
      <span>HERMES ECOSYSTEM // RADAR v1.0.0</span>
      <a href="https://github.com/flavio-guedes/Cerebro" target="_blank" style="color:var(--cyan);text-decoration:none;">flavio-guedes/Cerebro</a>
    </footer>
  </div>

  <script>
    const ecosystem = {
      skills: [
        { name: "Frontend (HTML/CSS/JS)", maturity: "high", tools: ["Vite", "Webpack", "Storybook", "Chromatic"] },
        { name: "React / Next.js", maturity: "high", tools: ["Next.js", "React", "TypeScript", "Vite"] },
        { name: "Tailwind CSS", maturity: "high", tools: ["Tailwind", "PostCSS", "Autoprefixer"] },
        { name: "Python / FastAPI", maturity: "high", tools: ["FastAPI", "Uvicorn", "Pydantic", "Alembic"] },
        { name: "IA / LLMs / Embeddings", maturity: "mid", tools: ["OpenAI", "Anthropic", "HuggingFace", "LangChain"] },
        { name: "Automação / Agents", maturity: "mid", tools: ["n8n", "Make", "Zapier", "CrewAI"] },
        { name: "GitHub Actions / CI", maturity: "mid", tools: ["GitHub Actions", "Workflows", "Environments"] },
        { name: "APIs / Integrações", maturity: "high", tools: ["REST", "GraphQL", "Webhooks", "OAuth2"] },
        { name: "Dashboards / Visualização", maturity: "high", tools: ["D3.js", "Recharts", "ECharts", "Grafana"] },
        { name: "Design Systems", maturity: "mid", tools: ["shadcn/ui", "Radix UI", "Storybook", "Tokens"] },
        { name: "Scraping / Browser", maturity: "mid", tools: ["Playwright", "Puppeteer", "Cheerio", "Browser Use"] },
        { name: "Deploy / GitHub Pages", maturity: "high", tools: ["GitHub Pages", "Vercel", "Netlify", "Docker"] }
      ],
      frameworks: [
        { name: "Next.js", status: "ACTIVE", details: "App Router, SSR/SSG, Edge Functions, API Routes" },
        { name: "FastAPI", status: "ACTIVE", details: "Async Python, OpenAPI, Dependency Injection, Middleware" },
        { name: "Tailwind", status: "ACTIVE", details: "Utility-first, JIT, Custom themes, Plugins" },
        { name: "GSAP", status: "ACTIVE", details: "ScrollTrigger, timelines, motion design, performance" },
        { name: "Framer Motion", status: "ACTIVE", details: "React animations, gestures, layout animations" },
        { name: "Three.js", status: "EXPERIMENTAL", details: "WebGL, 3D scenes, shaders, spatial interfaces" },
        { name: "Playwright", status: "PLANNED", details: "E2E testing, cross-browser, visual regression" },
        { name: "PostgreSQL", status: "ACTIVE", details: "Relational data, JSONB, migrations, pooling" },
        { name: "Redis", status: "ACTIVE", details: "Cache, sessions, queues, pub/sub" }
      ],
      maturity: [
        { domain: "Frontend", count: 4, maturity: "92%" },
        { domain: "IA / ML", count: 3, maturity: "85%" },
        { domain: "Automação", count: 4, maturity: "78%" },
        { domain: "Integrações", count: 5, maturity: "88%" },
        { domain: "DevOps", count: 3, maturity: "80%" },
        { domain: "Dados", count: 3, maturity: "90%" }
      ],
      competencies: [
        { name: "Arquitetura de interfaces de alto impacto", detail: "Dashboards, SaaS, CRMs, command centers, landing pages." },
        { name: "Sistemas de IA e automação", detail: "LLMs, agentes, pipelines de dados, automação de processos." },
        { name: "Dashboards e visualização de dados", detail: "KPIs, relatórios, data storytelling, real-time." },
        { name: "Integrações e APIs", detail: "APIs REST/GraphQL, webhooks, OAuth2, conectores externos." },
        { name: "Design Systems e componentização", detail: "Bibliotecas reutilizáveis, tokens, documentação viva." },
        { name: "Deploy e infraestrutura web", detail: "CI/CD, GitHub Pages, Vercel, Docker, monitoramento." }
      ]
    };

    let currentTab = 'radar';

    function renderSkills() {
      const container = document.getElementById('main-content');
      if (!container) return;
      container.innerHTML = '';
      container.className = 'skill-list';
      ecosystem.skills.forEach(skill => {
        const item = document.createElement('div');
        item.className = 'skill-item';
        const maturityLabel = skill.maturity === 'high' ? 'ALTA' : skill.maturity === 'mid' ? 'MÉDIA' : 'BAIXA';
        const maturityClass = skill.maturity === 'high' ? 'tag-success' : skill.maturity === 'mid' ? 'tag-warning' : 'tag-danger';
        item.innerHTML = `
          <div class="skill-header">
            <span class="skill-name">${skill.name}</span>
            <span class="tag ${maturityClass}">${maturityLabel}</span>
            <span class="skill-expand">+</span>
          </div>
          <div class="skill-body">
            <div style="font-size:10px;color:var(--text-muted);margin-bottom:4px;">Ferramentas</div>
            <div class="tool-list">
              ${(skill.tools || []).map(t => `<span class="tag tag-info">${t}</span>`).join('')}
            </div>
          </div>
        `;
        item.addEventListener('click', () => item.classList.toggle('expanded'));
        container.appendChild(item);
      });
    }

    function renderFrameworks() {
      const container = document.getElementById('main-content');
      if (!container) return;
      container.innerHTML = '';
      container.className = 'framework-list';
      ecosystem.frameworks.forEach(fw => {
        const item = document.createElement('div');
        item.className = 'framework-item';
        item.innerHTML = `
          <div class="framework-header">
            <span class="framework-name">${fw.name}</span>
            <span class="tag ${fw.status === 'ACTIVE' ? 'tag-success' : fw.status === 'EXPERIMENTAL' ? 'tag-warning' : 'tag-info'}">${fw.status}</span>
            <span class="framework-expand">+</span>
          </div>
          <div class="framework-body">
            <div style="color:var(--text);margin-bottom:4px;">Implementação:</div>
            <div>${fw.details}</div>
          </div>
        `;
        item.addEventListener('click', () => item.classList.toggle('expanded'));
        container.appendChild(item);
      });
    }

    function renderMaturity() {
      const container = document.getElementById('main-content');
      if (!container) return;
      container.innerHTML = '';
      container.className = 'maturity-list';
      ecosystem.maturity.forEach(m => {
        const row = document.createElement('div');
        row.className = 'maturity-row';
        row.innerHTML = `
          <span class="maturity-domain">${m.domain}</span>
          <div class="maturity-bar"><div class="maturity-fill" style="width:${m.maturity}"></div></div>
          <span class="tag tag-success">${m.maturity}</span>
        `;
        container.appendChild(row);
      });
    }

    function renderCompetencies() {
      const container = document.getElementById('main-content');
      if (!container) return;
      container.innerHTML = '';
      container.className = 'comp-list';
      ecosystem.competencies.forEach(c => {
        const item = document.createElement('div');
        item.className = 'comp-item';
        item.innerHTML = `
          <div class="comp-header">
            <span>${c.name}</span>
            <span class="skill-expand" style="color:var(--cyan)">+</span>
          </div>
          <div class="comp-body">
            <div style="color:var(--text-muted);margin-bottom:4px;">Aplicação:</div>
            <div>${c.detail}</div>
          </div>
        `;
        item.addEventListener('click', () => item.classList.toggle('expanded'));
        container.appendChild(item);
      });
    }

    function renderRadar() {
      const container = document.getElementById('main-content');
      if (!container) return;
      container.className = 'radar-container';
      container.innerHTML = `
        <svg class="radar-svg" viewBox="0 0 100 100">
          <defs>
            <radialGradient id="radarFill" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="var(--cyan)" stop-opacity="0.2"/>
              <stop offset="100%" stop-color="var(--cyan)" stop-opacity="0.05"/>
            </radialGradient>
          </defs>
          <polygon points="50,10 90,35 90,75 50,95 10,75 10,35" fill="none" stroke="var(--border)" stroke-width="0.5"/>
          <polygon points="50,20 80,40 80,70 50,88 20,70 20,40" fill="none" stroke="var(--border)" stroke-width="0.5" opacity="0.5"/>
          <polygon points="50,30 70,45 70,65 50,80 30,65 30,45" fill="none" stroke="var(--border)" stroke-width="0.5" opacity="0.3"/>
          <line x1="50" y1="50" x2="50" y2="10" stroke="var(--cyan)" stroke-width="0.5" opacity="0.5"/>
          <line x1="50" y1="50" x2="90" y2="35" stroke="var(--cyan)" stroke-width="0.5" opacity="0.5"/>
          <line x1="50" y1="50" x2="90" y2="75" stroke="var(--cyan)" stroke-width="0.5" opacity="0.5"/>
          <line x1="50" y1="50" x2="50" y2="95" stroke="var(--cyan)" stroke-width="0.5" opacity="0.5"/>
          <line x1="50" y1="50" x2="10" y2="75" stroke="var(--cyan)" stroke-width="0.5" opacity="0.5"/>
          <line x1="50" y1="50" x2="10" y2="35" stroke="var(--cyan)" stroke-width="0.5" opacity="0.5"/>
          <circle cx="50" cy="50" r="3" fill="var(--cyan)"/>
        </svg>
      `;
    }

    function updateMainPanel(tab) {
      currentTab = tab;
      const titles = {
        radar: 'Raio-X',
        skills: 'Skills & Competências',
        frameworks: 'Frameworks Implementados',
        maturity: 'Maturidade por Domínio',
        competencies: 'Competências Principais'
      };
      document.getElementById('panel-title').textContent = titles[tab] || 'Raio-X';
      switch(tab) {
        case 'radar': renderRadar(); break;
        case 'skills': renderSkills(); break;
        case 'frameworks': renderFrameworks(); break;
        case 'maturity': renderMaturity(); break;
        case 'competencies': renderCompetencies(); break;
      }
    }

    function init() {
      document.getElementById('active-skills').textContent = String(ecosystem.skills.length);
      document.getElementById('main-skills').textContent = String(ecosystem.competencies.length);
      document.getElementById('maturity-level').textContent = 'ADVANCED';
      document.getElementById('metric-frameworks').textContent = String(ecosystem.frameworks.filter(f => f.status === 'ACTIVE').length);

      document.querySelectorAll('.nav button').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          updateMainPanel(btn.dataset.tab);
        });
      });

      document.querySelectorAll('.brain-hotspot').forEach(spot => {
        spot.style.cursor = 'pointer';
        spot.addEventListener('click', () => {
          const area = spot.dataset.area;
          const mapping = {
            frontend: 'skills',
            ia: 'skills',
            automacao: 'skills',
            integracoes: 'skills'
          };
          const tab = mapping[area] || 'radar';
          document.querySelectorAll('.nav button').forEach(b => {
            b.classList.toggle('active', b.dataset.tab === tab);
          });
          updateMainPanel(tab);
        });
      });

      updateMainPanel('radar');
    }

    init();
  </script>
</body>
</html>
